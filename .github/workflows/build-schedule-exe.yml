name: Build Schedule Batch EXE

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyMuPDF==1.26.7 pyinstaller==6.16.0
      - name: Apply v0.5 changes
        shell: pwsh
        run: |
          python schedule_batch/apply_v03.py
          python schedule_batch/apply_v04.py
          python schedule_batch/apply_v05.py
          python -m py_compile schedule_batch/final_app.py schedule_batch/timetable.py
      - name: Build EXE
        shell: pwsh
        run: |
          cd schedule_batch
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ClassScheduleMaker final_app.py
          Get-Item dist\ClassScheduleMaker.exe | Format-List Name,Length,FullName
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassScheduleMaker-Windows-v0.5
          path: schedule_batch/dist/ClassScheduleMaker.exe
          if-no-files-found: error
          retention-days: 7
